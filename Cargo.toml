[workspace]
resolver = "2"
members = ["crates/mnemo-core", "crates/mnemo-node"]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
